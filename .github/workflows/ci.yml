name: CI                          # Display name in the Actions tab

on:                               # WHEN this runs
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:              # adds a manual "Run workflow" button

jobs:                             # WHAT runs
  build:                          # job ID (you choose this)
    name: Build and test          # display name (optional)
    runs-on: ubuntu-latest        # WHERE it runs

    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test
